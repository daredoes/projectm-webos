name: Benchmark presets

# Builds the IPK, installs it on each TV and runs every preset with generated test audio,
# then uploads each TV's fps table. Runs on a self-hosted runner on the home network
# (label "lan"), since the TVs are only reachable there, one TV after another. The full
# preset set takes about 9 hours per TV; a cancelled or interrupted run resumes where it
# stopped.
on:
  workflow_dispatch:
    inputs:
      fresh:
        description: Discard earlier results on the TVs and start over
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  benchmark:
    needs: build
    runs-on: [self-hosted, lan]
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - tv: dan-cave-webos6
            host: 192.168.1.32
          - tv: bedroom-webos7
            host: 192.168.1.65
          - tv: living-room-webos8
            host: 192.168.1.81
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ipk
          path: dist

      - name: sshpass
        run: command -v sshpass || (sudo apt-get update -q && sudo apt-get install -yq sshpass)

      - name: Benchmark
        env:
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: scripts/benchmark-tv.sh "${{ matrix.host }}" dist/*.ipk "bench-${{ matrix.tv }}.tsv" ${{ inputs.fresh && 'fresh' || '' }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench-${{ matrix.tv }}
          path: bench-${{ matrix.tv }}.tsv
          if-no-files-found: ignore
